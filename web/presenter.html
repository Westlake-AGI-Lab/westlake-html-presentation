<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presenter view</title><link rel="stylesheet" href="assets/presenter.css"></head>
<body>
  <header class="speaker-header">
    <div class="speaker-identity"><span class="workspace-name">Learning Workspace</span><h1 id="viewTitle">Presenter view</h1><p id="sessionStatus" role="status"></p></div>
    <div class="timer-tools"><output id="elapsed" aria-label="Elapsed time">00:00:00</output><button id="pauseTimer" type="button"></button><button id="resetTimer" type="button"></button></div>
    <div class="header-actions"><button id="presenterFull" type="button" aria-pressed="false"></button><button id="languageButton" type="button"></button><button id="endPresentation" type="button"></button></div>
  </header>
  <p class="setup-hint" id="setupHint"></p>
  <main class="speaker-layout">
    <section class="preview-section current-section" aria-labelledby="currentLabel"><div class="preview-heading"><h2 id="currentLabel"></h2><span id="currentTitle"></span></div><div class="preview-window" id="currentPreview"></div></section>
    <section class="preview-section next-section" aria-labelledby="nextLabel"><div class="preview-heading"><h2 id="nextLabel"></h2><span id="nextTitle"></span></div><div class="preview-window" id="nextPreview"></div></section>
    <section class="notes-section" aria-labelledby="notesLabel"><h2 id="notesLabel"></h2><div id="speakerNotes" tabindex="0"></div></section>
  </main>
  <footer class="presenter-controls">
    <div class="route-tools"><button id="routeButton" type="button"></button><button id="returnMain" type="button" hidden></button></div>
    <nav class="speaker-navigation" aria-label="Slide navigation"><button id="presenterPrev" type="button"></button><span id="presenterCount" aria-live="polite"></span><button id="presenterNext" type="button"></button></nav>
    <div class="slide-jump"><label id="jumpLabel" for="jumpSelect"></label><select id="jumpSelect"></select></div>
  </footer>
  <section id="mediaSection"><h2 id="mediaLabel"></h2><div id="mediaControls"></div></section>
  <script src="assets/presenter-view.js"></script>
</body>
</html>
