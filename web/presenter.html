<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>演讲者视图</title><link rel="stylesheet" href="assets/presenter.css"></head><body><header class="speaker-header"><div><h1 id="viewTitle"></h1><p id="sessionStatus" role="status"></p></div><div class="timer-tools"><output id="elapsed" aria-label="Elapsed time">00:00:00</output><button id="pauseTimer" type="button"></button><button id="resetTimer" type="button"></button></div><button id="presenterFull" type="button" aria-pressed="false"></button><button id="languageButton" type="button"></button><button id="endPresentation" type="button"></button></header><p class="setup-hint" id="setupHint"></p><main class="speaker-layout"><section class="preview-section"><div class="preview-heading"><h2 id="currentLabel"></h2><span id="currentTitle"></span></div><div class="preview-window" id="currentPreview"></div></section><section class="preview-section"><div class="preview-heading"><h2 id="nextLabel"></h2><span id="nextTitle"></span></div><div class="preview-window" id="nextPreview"></div></section><section class="notes-section"><h2 id="notesLabel"></h2><div id="speakerNotes" tabindex="0"></div></section><aside class="presenter-controls"><div class="speaker-navigation"><button id="presenterPrev" type="button"></button><span id="presenterCount"></span><button id="presenterNext" type="button"></button></div><label id="jumpLabel" for="jumpSelect"></label><select id="jumpSelect"></select><div class="route-tools"><button id="routeButton" type="button"></button><button id="returnMain" type="button" hidden></button></div><section id="mediaSection"><h2 id="mediaLabel"></h2><div id="mediaControls"></div></section></aside></main><script src="assets/presenter-view.js"></script></body></html>
